[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pr-review"
version = "0.1.0"
description = "Bounded Claude review of GitHub pull requests"
requires-python = ">=3.10"
dependencies = ["anthropic==1.11.0"]

[project.scripts]
claude-pr-review = "prreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
