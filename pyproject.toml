[build-system]
requires = ["flit_core==4.1.0"]
build-backend = "flit_core.buildapi"

[project]
name = "claude-pr-review"
version = "0.2.0"
description = "Bounded Claude review of GitHub pull requests"
requires-python = ">=3.10"
dependencies = ["anthropic==1.11.0"]

[project.scripts]
claude-pr-review = "pr_review.cli:main"

[tool.flit.module]
name = "pr_review"
